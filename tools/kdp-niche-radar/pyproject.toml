[project]
name = "kdp-niche-radar"
version = "1.0.0"
description = "Scored keyword and competition reports for KDP self-publishers. Offline, private, no accounts."
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]
license = { text = "MIT" }

[project.scripts]
radar = "kdp_niche_radar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["kdp_niche_radar*"]
