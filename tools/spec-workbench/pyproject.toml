[project]
name = "spec-workbench"
version = "0.1.0"
description = "Turn a rough brief into a structured, revisioned, testable spec. Offline, rule based."
requires-python = ">=3.10"
dependencies = ["spec-grader"]
license = { text = "MIT" }

[project.scripts]
spec-bench = "spec_workbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["spec_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
